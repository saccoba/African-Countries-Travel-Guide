<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <title>Explore-Africa</title>
  </head>
  
  <body>
    <header class="hero">
      <nav class="container">
        <strong>Explore Africa</strong>

        <ul>
          <li><a href="/">Home</a></li>
        </ul>
      </nav>

      <div class="container hero-content">
        <h1>Explore Africa</h1>

        <p>
          Discover beautiful countries, cultures, landmarks, and unforgettable
          destinations across Africa.
        </p>
      </div>
    </header>

      <main class="container">
      <section>
        <h2>Featured Countries</h2>
        <p>Select a country to learn more about it.</p>

       <div class="search-container">
         <label for="country-search">Search countries:</label>

       <input
         type="search"
         id="country-search"
         placeholder="Search by name, capital, region, language, or attraction"
      >
    </div>

        <div id="countries-container" class="country-grid"></div>
      </section>
    </main>

    <footer class="container">
      <p>Explore Africa Travel Guide</p>
    </footer>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
